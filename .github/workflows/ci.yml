name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # SIMD paths differ per arch: macos-latest is arm64 (NEON/AdvSimd),
        # ubuntu/windows are x64 (AVX2/SSSE3). All three must stay green.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs tag history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache RFC 8251 test vectors
        uses: actions/cache@v4
        with:
          path: tests/Kiln.Audio.Tests/Fixtures/opus_testvectors
          key: opus-testvectors-${{ hashFiles('scripts/fetch-test-vectors.sh') }}
      - name: Cache libopus oracle
        uses: actions/cache@v4
        with:
          path: .oracle/bin
          # v2 adds ec_probe (range-coder differential oracle) to the cached binaries.
          key: libopus-oracle-v2-${{ runner.os }}-${{ hashFiles('scripts/build-libopus-oracle.sh', 'tests/Kiln.Audio.Tests/Oracle/native/ec_probe.c', 'tests/Kiln.Audio.Tests/Oracle/native/CMakeLists.txt') }}
      - name: Fetch RFC 8251 test vectors
        shell: bash
        run: bash scripts/fetch-test-vectors.sh
      - name: Build libopus oracle
        shell: bash
        run: bash scripts/build-libopus-oracle.sh
      - name: Restore
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release
      - name: Test
        env:
          KILN_AUDIO_REQUIRE_ORACLE: ${{ (matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest') && '1' || '0' }}
        run: dotnet test --no-build -c Release --logger "trx" --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

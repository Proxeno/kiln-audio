name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners (owner, 2026-11-28): the repo is public, so hosted minutes are free, and
        # self-hosted runners must not serve a public repo (the org runner group disallows public repos).
        # SIMD paths differ per arch: macos-latest is arm64 (AdvSimd), Linux/Windows are x64 (AVX2+FMA).
        include:
          - os: linux
            runs_on: ubuntu-latest
            require_oracle: '1'
          - os: windows
            runs_on: windows-latest
            require_oracle: '0'
          - os: macos
            runs_on: macos-latest
            require_oracle: '1'
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs tag history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - name: Prefer Git for Windows bash
        # system32 bash.exe is WSL, which refuses to run as the runner's LocalSystem account.
        # GITHUB_PATH prepends, so later `shell: bash` steps resolve to Git's bash.
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      - name: Cache RFC 8251 test vectors
        uses: actions/cache@v4
        with:
          path: tests/Kiln.Audio.Tests/Fixtures/opus_testvectors
          key: opus-testvectors-${{ hashFiles('scripts/fetch-test-vectors.sh') }}
      - name: Cache libopus oracle
        uses: actions/cache@v4
        with:
          path: .oracle/bin
          # v2 adds ec_probe (range-coder differential oracle) to the cached binaries.
          key: libopus-oracle-v2-${{ runner.os }}-${{ hashFiles('scripts/build-libopus-oracle.sh', 'tests/Kiln.Audio.Tests/Oracle/native/ec_probe.c', 'tests/Kiln.Audio.Tests/Oracle/native/CMakeLists.txt') }}
      - name: Fetch RFC 8251 test vectors
        shell: bash
        run: bash scripts/fetch-test-vectors.sh
      - name: Build libopus oracle
        # The Windows runner has no C toolchain; its oracle tests are optional (require_oracle 0).
        if: matrix.os != 'windows'
        shell: bash
        run: bash scripts/build-libopus-oracle.sh
      - name: Restore
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release
      - name: Test
        env:
          KILN_AUDIO_REQUIRE_ORACLE: ${{ matrix.require_oracle }}
        run: dotnet test --no-build -c Release --logger "trx" --results-directory artifacts/test-results
      - name: Upload test results
        # Only on failure, and never fatal: the org artifact storage quota is shared.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

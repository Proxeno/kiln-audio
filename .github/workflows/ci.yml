name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # Self-hosted Proxeno org runners (owner, 2026-11-26: the GitHub-hosted Actions budget is exhausted).
        # SIMD paths differ per arch: macOS is arm64 (NEON/AdvSimd), Linux/Windows are x64 (AVX2/SSSE3).
        # Linux uses the `docker` label to stay off the weft-vast-ci boxes (weft rule: not for builds).
        include:
          - os: linux
            runs_on: [self-hosted, Linux, X64, docker]
            require_oracle: '1'
          - os: windows
            runs_on: [self-hosted, Windows, X64]
            require_oracle: '0'
          - os: macos
            runs_on: [self-hosted, macOS, ARM64]
            require_oracle: '1'
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs tag history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
        env:
          # Self-hosted fleet: the default global install prefix is not writable ("mkdir: Permission denied").
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - name: Prefer Git for Windows bash
        # system32 bash.exe is WSL, which refuses to run as the runner's LocalSystem account.
        # GITHUB_PATH prepends, so later `shell: bash` steps resolve to Git's bash.
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      - name: Cache RFC 8251 test vectors
        uses: actions/cache@v4
        with:
          path: tests/Kiln.Audio.Tests/Fixtures/opus_testvectors
          key: opus-testvectors-${{ hashFiles('scripts/fetch-test-vectors.sh') }}
      - name: Cache libopus oracle
        uses: actions/cache@v4
        with:
          path: .oracle/bin
          key: libopus-oracle-${{ runner.os }}-${{ hashFiles('scripts/build-libopus-oracle.sh') }}
      - name: Fetch RFC 8251 test vectors
        shell: bash
        run: bash scripts/fetch-test-vectors.sh
      - name: Build libopus oracle
        shell: bash
        run: bash scripts/build-libopus-oracle.sh
      - name: Restore
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release
      - name: Test
        env:
          KILN_AUDIO_REQUIRE_ORACLE: ${{ matrix.require_oracle }}
        run: dotnet test --no-build -c Release --logger "trx" --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
